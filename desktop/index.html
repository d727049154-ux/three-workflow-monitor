<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>工作流观察</title>
  <link rel="stylesheet" href="plugin/panel.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="desktop-titlebar">
    <span class="desktop-wordmark"><img src="assets/tray.png" alt="">工作流观察<span class="desktop-edition">独立版</span></span>
    <nav aria-label="窗口控制">
      <button id="dock-show" type="button" aria-label="显示侧边任务条" title="把进行中的任务挂在屏幕旁边">挂边</button>
      <button id="pin" type="button" aria-label="始终置顶" aria-pressed="true" title="始终置顶">置顶</button>
      <button id="compact" type="button" aria-label="收起为摘要" title="收起为摘要">收起</button>
      <button id="more" type="button" aria-label="更多窗口选项" title="窗口选项与退出">⋯</button>
      <button id="hide" type="button" aria-label="隐藏到托盘" title="隐藏到托盘，继续观察">×</button>
    </nav>
  </header>
  <div id="desktop-error" role="alert" hidden></div>
  <main id="panel" aria-label="工作流观察完整面板"><div id="app"></div></main>
  <section id="compact-panel" aria-label="工作流摘要" hidden>
    <div class="compact-heading"><span id="compact-overview">正在读取流程…</span><button id="compact-refresh" type="button">刷新</button></div>
    <div id="compact-flows"></div>
  </section>
  <footer class="desktop-status"><span class="status-dot" id="status-dot"></span><span id="status-text">正在连接本机记录…</span><span class="desktop-tray-hint">关窗后在托盘继续观察</span></footer>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
