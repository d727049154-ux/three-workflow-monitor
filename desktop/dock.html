<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>进行中任务 · 工作流观察</title>
  <link rel="stylesheet" href="dock.css">
</head>
<body>
  <main class="dock" id="dock" data-side="left">
    <section class="detail" id="detail" aria-label="任务详情" hidden>
      <header class="detail-header"><span id="detail-label">任务进展</span><button id="collapse" type="button" aria-label="收起任务详情" title="收起详情">×</button></header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="detail-content" class="detail-content"></div>
      <footer class="detail-footer"><button id="open-thread" type="button">打开原聊天</button><span id="detail-footnote">本机记录</span></footer>
    </section>
    <aside class="rail" aria-label="进行中任务侧边条">
      <header class="rail-header" title="按住这里拖动，会自动贴到屏幕左侧或右侧"><span class="grip">⋮⋮</span><strong>任务 <span id="task-count">…</span></strong><span id="rail-time">正在连接</span></header>
      <div id="task-list" class="task-list" aria-label="正在进行的任务"></div>
      <div id="rail-error" class="rail-error" role="status" hidden></div>
      <footer class="rail-footer">
        <button id="refresh" type="button" title="立即读取任务并发现新聊天">↻ 刷新</button>
        <button id="history" type="button" title="查看侧边任务的历史快照">◷ 回溯</button>
        <button id="panel" type="button" title="工作流、Skills Manager、技能与资源">完整面板</button>
        <button id="pin" type="button" aria-pressed="false" disabled>置顶</button>
        <button id="menu" class="menu-button" type="button" aria-label="侧边条更多选项" title="贴边、置顶、隐藏和退出">⋯</button>
      </footer>
    </aside>
  </main>
  <script type="module" src="dock.mjs"></script>
</body>
</html>
