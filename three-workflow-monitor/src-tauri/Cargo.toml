[package]
name = "workflow-monitor"
version = "0.8.0"
description = "Local workflow observation desktop application"
edition = "2021"
license = "MIT"

[lib]
name = "workflow_monitor"
path = "src/lib.rs"

[[bin]]
name = "workflow-monitor"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-single-instance = "=2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
regex = "1"
